{id:'historia',mod:'15',grp:'A',icon:'🧭',title:'História do magnetismo',desc:'Ímãs, bússola, Oersted, Ampère, Faraday e Maxwell.',min:7,tag:'Fundamentos',macete:'Oersted: eletricidade cria campo magnético. Faraday: fluxo magnético variando cria corrente induzida.',trap:'Um ímã parado perto de uma espira parada não gera corrente contínua por indução. É necessária mudança de fluxo.',body:`<p>O magnetismo era conhecido pela atração exercida pela <strong>magnetita</strong> sobre o ferro. O estudo da bússola mostrou que a Terra se comporta aproximadamente como um enorme ímã, com campo magnético próprio.</p><h3>O que cai em nomes e descobertas?</h3><div class="tablewrap"><table><tr><th>Cientista / ideia</th><th>O que recordar</th></tr><tr><td>William Gilbert</td><td>Estudou ímãs e descreveu a Terra como um grande ímã.</td></tr><tr><td>Ørsted (1820)</td><td>Mostrou que uma corrente elétrica desvia a agulha da bússola: corrente cria campo magnético.</td></tr><tr><td>Ampère</td><td>Investigou as forças entre correntes e as relações entre corrente elétrica e magnetismo.</td></tr><tr><td>Faraday (1831)</td><td>Demonstrou a indução eletromagnética: variações de fluxo magnético geram fem induzida.</td></tr><tr><td>Maxwell</td><td>Unificou a descrição dos fenômenos elétricos e magnéticos em equações.</td></tr></table></div><h3>Ímãs e campos magnéticos</h3><p>Um ímã tem <strong>polo norte e polo sul</strong>. Polos iguais se repelem; polos diferentes se atraem. Fora do ímã, as linhas do campo magnético vão do polo norte para o sul e formam linhas fechadas ao continuar pelo interior.</p><div class="note"><b>💡 Macete</b>Quebrar um ímã não produz um polo norte isolado. Cada pedaço continua com norte e sul.</div>`,q:{q:'Quem demonstrou que uma corrente elétrica produz campo magnético, desviando uma bússola?',o:['Faraday','Ørsted','Newton','Huygens'],a:1,e:'Ørsted observou o efeito da corrente elétrica sobre a bússola em 1820.'}},
{id:'corrente',mod:'16',grp:'A',icon:'🧲',title:'Corrente produz campo magnético',desc:'Fio retilíneo, espira, solenoide e regra da mão direita.',min:12,tag:'Campo B',macete:'Polegar da mão direita aponta no sentido da corrente convencional; dedos curvados mostram o sentido do campo em torno do fio.',trap:'Se duplicar a distância a um fio longo, B cai pela metade; se duplicar a corrente, B dobra.',body:`<p>Uma corrente elétrica gera um <strong>campo magnético B</strong>. A unidade de B é o tesla (T). O campo circula em torno de um fio longo retilíneo.</p><h3>Fio retilíneo muito longo</h3><div class="formula">B = μ₀ · I / (2πr)</div><p><strong>I</strong> é a corrente (A), <strong>r</strong> é a distância ao fio (m), e <strong>μ₀ = 4π × 10⁻⁷ T·m/A</strong> no vácuo.</p><div class="example"><strong>Exemplo resolvido</strong><p>Um fio conduz I = 5 A. A 10 cm = 0,10 m, o campo é:</p><div class="formula">B = 2 × 10⁻⁷ × (5 / 0,10) = 1 × 10⁻⁵ T = 10 μT</div></div><h3>Regra da mão direita</h3><p>Segura o fio com a <strong>mão direita</strong>. O polegar aponta no sentido da corrente convencional; os dedos enrolados indicam o sentido do campo magnético. Símbolo <strong>⊙</strong> = vetor saindo do papel; <strong>⊗</strong> = entrando no papel.</p><h3>Outras geometrias</h3><div class="tablewrap"><table><tr><th>Geometria</th><th>Expressão idealizada</th></tr><tr><td>Centro de uma espira circular</td><td>B = μ₀I / (2R)</td></tr><tr><td>Centro de N espiras iguais</td><td>B = μ₀NI / (2R)</td></tr><tr><td>Interior de solenoide longo</td><td>B ≈ μ₀ n I, n = N/L</td></tr></table></div><div class="note"><b>💡 Em prova</b>Fio longo: B proporcional a I e inversamente proporcional à distância r. Duplicou r, B cai pela metade.</div>`,q:{q:'Num fio longo, se a corrente dobra e a distância ao fio permanece fixa, o campo magnético:',o:['Cai pela metade','Fica igual','Dobra','Quadruplica'],a:2,e:'Pela expressão B = μ₀I/(2πr), o campo é diretamente proporcional à corrente.'}},
{id:'forca',mod:'17',grp:'A',icon:'⚡',title:'Força magnética',desc:'Carga em movimento, fio com corrente e ângulo entre vetores.',min:11,tag:'Força',macete:'A força é máxima a 90° e nula a 0°/180°. O seno do ângulo resolve essa pegadinha.',trap:'Uma carga parada num campo magnético estático não sofre força magnética. O sinal da carga altera o sentido, não o módulo.',body:`<p>Uma carga elétrica em movimento pode sofrer uma força ao atravessar um campo magnético. A força é perpendicular tanto à velocidade quanto ao campo.</p><h3>Carga em movimento</h3><div class="formula">F = |q| · v · B · sen θ</div><p><strong>|q|</strong> é o módulo da carga (C); <strong>v</strong>, a velocidade (m/s); <strong>B</strong>, o campo (T); <strong>θ</strong>, o ângulo entre a velocidade e B.</p><div class="tablewrap"><table><tr><th>Ângulo</th><th>sen θ</th><th>Força</th></tr><tr><td>0° ou 180°</td><td>0</td><td>Zero</td></tr><tr><td>30°</td><td>0,5</td><td>Metade de |q|vB</td></tr><tr><td>90°</td><td>1</td><td>Máxima</td></tr></table></div><div class="example"><strong>Exemplo resolvido</strong><p>Uma carga com |q| = 2 × 10⁻⁶ C move-se a v = 10³ m/s, perpendicularmente a B = 0,5 T.</p><div class="formula">F = 2 × 10⁻⁶ × 10³ × 0,5 × 1 = 10⁻³ N</div></div><h3>Força em um fio retilíneo</h3><div class="formula">F = B · I · L · sen θ</div><p>O fio precisa estar imerso no campo; L é o comprimento de fio que está nele. Para carga positiva, use a mão direita na direção de v × B; para carga negativa, inverta o sentido.</p><h3>Movimento circular</h3><p>Se v é perpendicular a B num campo uniforme, a força pode atuar como centrípeta: <strong>R = mv/(|q|B)</strong>. Ela altera a direção da velocidade, não o módulo, pois força magnética não realiza trabalho sobre uma carga pontual.</p>`,q:{q:'Uma carga entra paralelamente às linhas de um campo magnético uniforme. A força magnética vale:',o:['O máximo possível','Zero','qvB/2','O dobro de qvB'],a:1,e:'Como θ = 0°, sen(0°) = 0 e F = |q|vB sen θ = 0.'}},
{id:'inducao',mod:'18',grp:'A',icon:'🌀',title:'Indução eletromagnética',desc:'Fluxo magnético, leis de Faraday e Lenz, geradores.',min:13,tag:'Indução',macete:'Não é ter campo magnético que induz corrente: é MUDAR o fluxo. Lenz: a corrente induzida combate a mudança no fluxo.',trap:'O ângulo θ no fluxo é medido em relação à NORMAL (perpendicular) da superfície, não ao plano dela.',body:`<p>Quando o <strong>fluxo magnético</strong> através de uma espira muda, aparece uma força eletromotriz induzida (fem). Se o circuito estiver fechado, pode circular corrente.</p><h3>Fluxo magnético</h3><div class="formula">Φ = B · A · cos θ</div><p><strong>A</strong> é a área em m², <strong>B</strong> em tesla, e θ é o ângulo entre B e a <strong>normal</strong> à área. A unidade é weber (Wb).</p><h3>Lei de Faraday</h3><div class="formula">ε = −N · ΔΦ / Δt</div><p><strong>N</strong> é o número de espiras. O sinal negativo é explicado pela <strong>lei de Lenz</strong>: a fem induzida tende a produzir uma corrente cujo campo se opõe à variação do fluxo.</p><div class="example"><strong>Exemplo resolvido</strong><p>Uma bobina de 20 espiras tem fluxo de 0,03 Wb por espira que cai para 0,01 Wb em 0,2 s.</p><div class="formula">|ε| = 20 × |0,01 − 0,03| / 0,2 = 2 V</div></div><h3>Entendendo Lenz</h3><p>Se o fluxo que <strong>entra</strong> na página aumenta, a bobina tenta criar campo <strong>saindo</strong> da página. Se o fluxo entrando diminui, a bobina tenta manter o fluxo entrando. Atenção: ela se opõe à <em>mudança</em>, não obrigatoriamente ao campo original.</p><div class="note"><b>💡 Geradores e transformadores</b>Gerador usa movimento para variar fluxo e obter fem. Transformador ideal alimentado com corrente alternada: V₁/V₂ = N₁/N₂.</div>`,q:{q:'Uma espira parada sob um campo magnético uniforme e constante sofre indução de fem?',o:['Sim, sempre','Só por existir B','Não, porque o fluxo não varia','Sim, mas apenas no vácuo'],a:2,e:'Para haver fem induzida é necessário que o fluxo magnético varie com o tempo.'}},
{id:'espelhos',mod:'08',grp:'B',icon:'🪞',title:'Espelhos esféricos',desc:'Côncavo, convexo, foco, imagens e equação dos espelhos.',min:14,tag:'Óptica',macete:'Convexo SEMPRE dá imagem virtual, direita e menor. Côncavo depende de onde o objeto está em relação ao foco F e ao centro C.',trap:'Côncavo não forma sempre imagem maior. Além do centro C ela é real, invertida e menor. Lembre f = R/2.',body:`<p>Espelhos esféricos são superfícies refletoras que correspondem a parte de uma esfera. No <strong>côncavo</strong>, a face refletora fica voltada para dentro; no <strong>convexo</strong>, para fora.</p><h3>Pontos importantes</h3><div class="tablewrap"><table><tr><th>Símbolo</th><th>Significado</th></tr><tr><td>V</td><td>Vértice do espelho</td></tr><tr><td>F</td><td>Foco principal</td></tr><tr><td>C</td><td>Centro de curvatura</td></tr><tr><td>R</td><td>Raio de curvatura</td></tr></table></div><div class="formula">f = R/2</div><p>Para espelhos de pequena abertura (aproximação paraxial), usamos a <strong>equação de Gauss</strong>:</p><div class="formula">1/f = 1/p + 1/p′</div><p><strong>p</strong> é a distância do objeto e <strong>p′</strong> é a distância da imagem. Nesta convenção: f &gt; 0 para côncavo, f &lt; 0 para convexo; p′ &gt; 0 para imagem real e p′ &lt; 0 para virtual.</p><div class="formula">Aumento = h′/h = −p′/p</div><h3>Como o côncavo se comporta?</h3><div class="tablewrap"><table><tr><th>Objeto</th><th>Imagem</th></tr><tr><td>Além de C</td><td>Real, invertida, menor; entre C e F</td></tr><tr><td>Em C</td><td>Real, invertida, mesmo tamanho; em C</td></tr><tr><td>Entre C e F</td><td>Real, invertida, maior; além de C</td></tr><tr><td>Em F</td><td>No infinito (raios refletidos paralelos)</td></tr><tr><td>Entre F e V</td><td>Virtual, direita, maior; atrás do espelho</td></tr></table></div><div class="note"><b>💡 Espelho convexo</b>Para qualquer objeto real em frente a um convexo, a imagem é virtual, direita e menor. Por isso ele é usado em retrovisores com maior campo de visão.</div><div class="example"><strong>Exemplo resolvido</strong><p>Espelho côncavo f = 20 cm, objeto p = 60 cm. A imagem fica em p′ = fp/(p − f) = 20×60/40 = 30 cm.</p><p>O aumento é A = −30/60 = −0,5. Portanto, a imagem é <strong>real, invertida e metade do tamanho</strong>.</p></div>`,q:{q:'Em qualquer posição de um objeto real diante de espelho convexo, a imagem é:',o:['Real e maior','Virtual, direita e menor','Real e invertida','Virtual e invertida'],a:1,e:'O espelho convexo produz sempre imagem virtual, direita e reduzida para objetos reais.'}}
];

/* EstudaLab: question variety engine (stable across attempts). */
const quizShuffle = list => {
  const arr=[...list];
  for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
};
function quizVariety(items,n,namespace,keyOf,topicOf){
  const storageKey='estudalab.quiz.variety.v3.'+namespace;
  let history=[];
  try {const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');history=Array.isArray(saved)?saved.filter(x=>typeof x==='string').slice(-400):[]}catch{}
  const byId=new Map();
  for(const item of items){const id=String(keyOf(item));if(id&&!byId.has(id))byId.set(id,item)}
  const pool=[...byId.values()];
  const selected=[],picked=new Set(),topicCount=new Map();
  const lastSeen=item=>history.lastIndexOf(String(keyOf(item)));
  const topic=item=>String(topicOf(item)||'Geral');
  while(selected.length<Math.min(n,pool.length)){
    let possible=pool.filter(x=>!picked.has(String(keyOf(x))));
    const unseen=possible.filter(x=>lastSeen(x)<0);
    // No question is repeated while any unused question remains in this bank.
    if(unseen.length){possible=unseen}
    else{
      // Once the full bank has been used, bring back the oldest questions first.
      possible.sort((a,b)=>lastSeen(a)-lastSeen(b));
      possible=possible.slice(0,Math.min(possible.length,Math.max(5,(n-selected.length)*2)));
    }
    const minimum=Math.min(...possible.map(x=>topicCount.get(topic(x))||0));
    let candidates=possible.filter(x=>(topicCount.get(topic(x))||0)===minimum);
    if(!unseen.length){const oldest=Math.min(...candidates.map(lastSeen));candidates=candidates.filter(x=>lastSeen(x)===oldest)}
    const item=candidates[Math.floor(Math.random()*candidates.length)];
    const id=String(keyOf(item)),cat=topic(item);
    selected.push(item);picked.add(id);topicCount.set(cat,(topicCount.get(cat)||0)+1);
  }
  history=[...history,...selected.map(x=>String(keyOf(x)))].slice(-400);
  try{localStorage.setItem(storageKey,JSON.stringify(history))}catch{}
  return quizShuffle(selected);
}
function randomizedAnswers(original,optionsField,answerField){
  const item={...original};
  const options=original[optionsField].map((value,index)=>({value,isCorrect:index===original[answerField]}));
  const randomized=quizShuffle(options);
  item[optionsField]=randomized.map(x=>x.value);
  item[answerField]=randomized.findIndex(x=>x.isCorrect);
  return item;
}
function randomizedMath(q){
  const options=quizShuffle(q[2].map((value,index)=>({value,isCorrect:index===q[3]})));
  return [q[0],q[1],options.map(v=>v.value),options.findIndex(v=>v.isCorrect),q[4]];
}

function renderQuiz(){if(!quiz)return `<div class="eyebrow">TREINO DE PROVA</div><h1 class="title">Simulado de Física</h1><p class="lead">Questões dos cinco módulos que aparecem na tua folha. Respostas explicadas, uma por vez, sem entregar o gabarito antes.</p><div class="lesson-grid"><button class="lesson-card" data-start="15"><span class="lnum" style="align-self:start">SIMULADO GERAL</span><h3>15 questões</h3><p>Equilibra cinco módulos e alterna as respostas certas.</p><footer><span>Correção comentada</span><span>Começar →</span></footer></button><button class="lesson-card" data-start="15"><span class="lnum" style="align-self:start">NOVO SORTEIO</span><h3>15 questões</h3><p>Troca as questões e prioriza as que ainda não apareceram.</p><footer><span>Correção comentada</span><span>Começar →</span></footer></button></div>`;if(quiz.done){let hits=quiz.q.filter((z,i)=>quiz.a[i]===z.a).length;return `<div class="results"><div class="eyebrow">RESULTADO FINAL</div><strong>${hits}/${quiz.q.length}</strong><p>${hits===quiz.q.length?'Mandou bem, todos os acertos!':'Revise os macetes dos assuntos que errou.'}</p><button class="btn" data-restart>Fazer outro simulado</button></div><div class="sectionline"><h2>Correção completa</h2></div>${quiz.q.map((z,i)=>`<div class="panel"><b>${i+1}. ${esc(z.q)}</b><p>${quiz.a[i]===z.a?'✓ Acertou':'✕ Resposta correta: '+esc(z.o[z.a])}</p><p>${esc(z.e)}</p></div>`).join('')}`;}const z=quiz.q[quiz.i],sel=quiz.a[quiz.i];return `<div class="eyebrow">SIMULADO · ${quiz.i+1}/${quiz.q.length}</div><h1 class="title">Questão ${quiz.i+1}</h1><p class="lead">${esc(LESSONS.find(l=>l.id===z.area).title)}</p><div class="panel"><div style="height:6px;background:#e2e8f4;border-radius:8px;margin-bottom:23px"><div style="width:${Math.round((quiz.i+1)/quiz.q.length*100)}%;height:6px;background:#5579d4;border-radius:8px"></div></div><h2>${esc(z.q)}</h2>${z.o.map((s,i)=>`<button class="option ${sel===i?'selected':''} ${quiz.checked&&i===z.a?'right':''} ${quiz.checked&&sel===i&&i!==z.a?'wrong':''}" data-choice="${i}" ${quiz.checked?'disabled':''}><span class="letter">${'ABCD'[i]}</span>${esc(s)}</button>`).join('')}${quiz.checked?`<div class="feedback ${sel!==z.a?'bad':''}"><b>${sel===z.a?'✓ Correto!':'✕ Vamos entender'}</b>${esc(z.e)}</div><div class="btnrow"><button class="btn" id="nextQ">${quiz.i===quiz.q.length-1?'Ver meu resultado':'Próxima questão →'}</button></div>`:`<div class="btnrow"><button class="btn" id="checkQ" ${sel===undefined?'disabled':''}>Corrigir questão</button><button class="btn secondary" data-restart>Recomeçar simulado</button></div>`}</div>`}
function wireSVG(){const sign=direction==='out'?'⊙':'⊗';let arrows='';for(let radius of [47,86,125]){const angle=(direction==='out'?45:-45)*Math.PI/180;const xx=175+radius*Math.cos(angle), yy=154+radius*Math.sin(angle);arrows+=`<circle cx="175" cy="154" r="${radius}" stroke="#8da4d5" stroke-width="1.8" fill="none" stroke-dasharray="${radius===125?'6 7':'none'}"/><g transform="translate(${xx} ${yy}) rotate(${direction==='out'?135:-135})"><path d="M-9 -6L0 0L-9 6" stroke="#3757ab" stroke-width="3" fill="none" stroke-linecap="round"/></g>`}return `<svg viewBox="0 0 350 310" role="img" aria-label="Linhas circulares do campo em torno de um fio elétrico, com orientação segundo a mão direita"><rect x="0" y="0" width="350" height="310" fill="transparent"/>${arrows}<circle cx="175" cy="154" r="28" fill="#e2ebff" stroke="#6f8ed0" stroke-width="2"/><text x="175" y="168" font-size="38" font-weight="700" text-anchor="middle" fill="#345bb7">${sign}</text><text x="175" y="290" font-size="12" font-weight="700" text-anchor="middle" fill="#697eac">Corrente ${direction==='out'?'saindo':'entrando'} na página</text></svg>`}
function mirrorSVG(){const conc=mirror==='concave',f=conc?20:-20,focus=440-(f*3),center=440-2*f*3,base=165,objh=32,ox=440-p*3;let pp=p===f?Infinity:(p*f/(p-f)),ix=440-(pp*3),scale=-pp/p,imageh=objh*scale;
const line=(x1,y1,x2,y2,stroke='#3b78c5',dash='',w=2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
const arrow=(x,y,h,stroke)=>`${line(x,y,x,y-h,stroke,'',3)}<path d="M${x-5} ${y-h+9} L${x} ${y-h} L${x+5} ${y-h+9}" stroke="${stroke}" stroke-width="2.5" fill="none"/>`;
const finite=Number.isFinite(pp),pVisible=finite&&ix>=10&&ix<=700,drawh=Math.max(-125,Math.min(125,imageh));let layers=`<rect width="700" height="330" fill="#f7faff"/>${line(20,base,680,base,'#b4c3db','5 5',1.5)}`;
if(conc){layers+=`<path d="M445 26 Q414 165 445 306" stroke="#5579c9" stroke-width="5" fill="none"/>`;}else{layers+=`<path d="M435 26 Q466 165 435 306" stroke="#5579c9" stroke-width="5" fill="none"/>`}
for(let [x,label,col] of [[focus,'F','#cf824d'],[center,'C','#8570b9']]){if(x>15&&x<686){layers+=`<circle cx="${x}" cy="${base}" r="3.4" fill="${col}"/><text x="${x}" y="${base+19}" text-anchor="middle" fill="${col}" font-size="12" font-weight="700">${label}</text>`}}
layers+=`<text x="440" y="${base+20}" text-anchor="middle" fill="#4268ac" font-size="12" font-weight="800">V</text>${arrow(ox,base,objh,'#159578')}<text x="${ox}" y="${base-objh-16}" text-anchor="middle" fill="#09876a" font-size="11" font-weight="700">Objeto</text>`;
// A ray parallel to the axis is reflected toward the real focus or appears to emerge from a virtual focus.
layers+=line(ox,base-objh,440,base-objh,'#3e7fcb','',2.4);const slope=(base-(base-objh))/(focus-440);const reflectedY=base-objh+slope*(25-440);layers+=line(440,base-objh,25,reflectedY,'#3e7fcb','',2.1);if(!conc)layers+=line(440,base-objh,Math.min(focus+35,686),base-objh+slope*(Math.min(focus+35,686)-440),'#3e7fcb','5 5',1.6);
// Ray through the vertex, drawn as a principal ray, with virtual extension behind mirror.
layers+=line(ox,base-objh,440,base,'#d29953','',2.1);const slope2=objh/p;layers+=line(440,base,25,base+slope2*(25-440),'#d29953','',2.1);if(!conc||pp<0)layers+=line(440,base,680,base+slope2*240,'#d29953','5 5',1.5);
if(pVisible){layers+=arrow(ix,base,drawh,'#bb5272')+`<text x="${ix}" y="${base-drawh+(drawh>0?-14:22)}" font-size="11" text-anchor="middle" font-weight="700" fill="#ad4b6c">Imagem</text>`;} else if(!finite){layers+=`<text x="576" y="51" fill="#ae5b7e" font-size="13" font-weight="700">Imagem no infinito</text>`;}else{layers+=`<text x="565" y="38" fill="#ae5b7e" font-size="11" font-weight="700">Imagem fora do desenho</text>`}
return `<svg viewBox="0 0 700 330" role="img" aria-label="Diagrama simplificado de raios em espelho ${conc?'côncavo':'convexo'} para um objeto a ${p} centímetros, com imagem calculada">${layers}</svg>`}
function mirrorStats(){const f=mirror==='concave'?20:-20;const infinite=p===f;if(infinite)return {pprime:'∞',mag:'∞',quality:'Imagem no infinito; os raios refletidos ficam paralelos.'};const ip=f*p/(p-f),mag=-ip/p;let status=ip>0?'Real e invertida':'Virtual e direita';status+=Math.abs(mag)>1.001?', aumentada':Math.abs(mag)<.999?', reduzida':', do mesmo tamanho';return {pprime:(Math.round(ip*10)/10)+' cm',mag:(Math.round(mag*100)/100)+'×',quality:status+'.'} }
function labWire(){let field=20*I/r;return `<div class="labgrid"><div class="panel"><h2>Campo magnético em um fio</h2><p>Altera a corrente I e a distância r. Observe o campo B e a orientação das linhas.</p><div class="formgrid"><label class="formlab">Corrente: <strong>${I} A</strong><input type="range" min="1" max="15" value="${I}" step="1" data-range="current"></label><label class="formlab">Distância: <strong>${r} cm</strong><input type="range" min="1" max="30" value="${r}" step="1" data-range="radius"></label><label class="formlab">Sentido da corrente<select data-select="direction"><option value="out" ${direction==='out'?'selected':''}>Saindo da página ⊙</option><option value="in" ${direction==='in'?'selected':''}>Entrando na página ⊗</option></select></label></div><div class="simcard" style="margin-top:19px"><small>CAMPO NA DISTÂNCIA ESCOLHIDA</small><div class="bigvalue">${field.toFixed(1).replace('.',',')} <small>μT</small></div><p>B = μ₀I/(2πr) · considere fio longo no vácuo.</p></div><div class="note"><b>💡 Macete</b>Dobrar I dobra o campo. Dobrar r reduz o campo à metade.</div></div><div class="panel"><h2>Visualização de B</h2><div class="svgcard">${wireSVG()}</div><p style="font-size:12px">O tamanho das circunferências é ilustrativo. As setas indicam o sentido do campo.</p></div></div>`}

function labMirror(){const m=mirrorStats();return `<div class="panel"><h2>Simulador de espelhos esféricos</h2><p>Muda o espelho e a posição do objeto. Veja a imagem se mover e confira o sinal de p′.</p><div class="formgrid"><label class="formlab">Tipo de espelho<select data-select="mirror"><option value="concave" ${mirror==='concave'?'selected':''}>Côncavo (f = +20 cm)</option><option value="convex" ${mirror==='convex'?'selected':''}>Convexo (f = −20 cm)</option></select></label><label class="formlab">Distância do objeto: <strong>${p} cm</strong><input data-range="object" type="range" min="10" max="115" step="5" value="${p}"></label></div><div class="svgcard" style="margin-top:19px">${mirrorSVG()}</div><div class="labgrid" style="margin-top:16px"><div class="simcard"><small>DISTÂNCIA DA IMAGEM (p′)</small><div class="bigvalue">${m.pprime}</div></div><div class="simcard"><small>AUMENTO LINEAR</small><div class="bigvalue">${m.mag}</div></div></div><div class="feedback" style="margin-top:13px"><b>Resultado</b>${m.quality}</div><div class="note warn"><b>⚠ Desenho esquemático</b>Os raios e alturas são ilustrativos; as posições e classificações seguem a equação de Gauss para espelhos esféricos paraxiais. No foco, a distância da imagem tende ao infinito.</div></div>`}

const positive=handState===0;body=`<rect x="31" y="24" width="247" height="213" rx="16" fill="#edf3fc" stroke="#d0dfef"/><g font-size="27" fill="#7191c5">${[[65,65],[130,65],[195,65],[255,65],[65,125],[130,125],[195,125],[255,125],[65,191],[130,191],[195,191],[255,191]].map(([x,y])=>`<text x="${x}" y="${y}">×</text>`).join('')}</g><path d="M65 123 H235" stroke="#2c8d8d" stroke-width="5"/><path d="M223 114 L237 123 L223 132" fill="none" stroke="#2c8d8d" stroke-width="4"/><text x="183" y="112" font-size="15" font-weight="700" fill="#278d8f">v →</text><path d="M153 126 V${positive?'45':'205'}" stroke="#df7856" stroke-width="5"/><path d="M145 ${positive?'58':'192'} L153 ${positive?'44':'208'} L161 ${positive?'58':'192'}" stroke="#df7856" stroke-width="4" fill="none"/><text x="165" y="${positive?'48':'218'}" fill="#d46c4e" font-size="16" font-weight="700">F ${positive?'↑':'↓'}</text><text x="155" y="265" text-anchor="middle" font-size="12" fill="#486389">Campo B entrando: ×</text>`;
}else{
const increasing=handState%2===0,into=handState<2;const inducedInto=into?!increasing:increasing;const clockwise=inducedInto;body=`<circle cx="155" cy="133" r="88" fill="none" stroke="#74a1d6" stroke-width="5"/><g font-size="28" fill="#90a7c6">${[[126,112],[174,112],[126,164],[174,164]].map(([x,y])=>`<text x="${x}" y="${y}">${into?'×':'⊙'}</text>`).join('')}</g><text x="155" y="29" font-size="14" font-weight="700" fill="#365d8c" text-anchor="middle">Campo externo ${into?'entra ⊗':'sai ⊙'}</text><text x="155" y="252" font-size="14" font-weight="700" fill="#2f7f70" text-anchor="middle">Corrente ${clockwise?'horária ↷':'anti-horária ↶'}</text><text x="155" y="269" font-size="12" fill="#5d7599" text-anchor="middle">Fluxo ${increasing?'aumenta':'diminui'}</text>`;
}
return `<svg viewBox="0 0 310 290" role="img" aria-label="Diagrama de ${handMode} com a direção do campo e corrente"><rect width="310" height="290" rx="13" fill="#f7faff"/>${body}</svg>`;
}
function handExplanation(){
if(handMode==='fio'){return {cases:['Corrente saindo ⊙','Corrente entrando ⊗'],steps:['Aponta o <b>polegar direito</b> na direção da corrente convencional.', 'Os <b>dedos que fecham</b> mostram como o campo magnético gira em torno do fio.',handState===0?'Com a corrente saindo do papel (⊙), o campo é <b>anti-horário</b>.':'Com a corrente entrando no papel (⊗), o campo é <b>horário</b>.'],tip:'⊙ = ponta da flecha vindo até você; ⊗ = traseira da flecha indo para longe.'}}
if(handMode==='espira'||handMode==='solenoide'){const isCoil=handMode==='solenoide';return {cases:['Corrente anti-horária ↶','Corrente horária ↷'],steps:['Curva os <b>dedos da mão direita</b> acompanhando a corrente ao redor da espira/bobina.', 'O <b>polegar aponta o campo magnético dentro</b> e indica a face norte.',handState===0?`Vista de frente, corrente anti-horária gera B <b>saindo do papel (⊙)</b>, face norte.`:`Vista de frente, corrente horária gera B <b>entrando no papel (⊗)</b>, face sul.`],tip:isCoil?'Para um solenoide, enrola os quatro dedos no sentido da corrente; polegar indica o norte magnético.':'Na espira, a corrente anti-horária faz o campo sair da folha. A horária faz o campo entrar.'}}
if(handMode==='forca'){return {cases:['Carga positiva +','Carga negativa −'],steps:['Usa a mão direita para o produto vetorial <b>v × B</b>: indicador em v, médio em B, polegar na força para carga positiva.', 'Aqui a velocidade vai para a direita e B entra na folha (×). A força para carga positiva aponta <b>para cima</b>.',handState===0?'Como a carga é <b>positiva</b>, mantém a força <b>para cima</b>.':'Como a carga é <b>negativa</b>, <b>inverte</b> o resultado: força <b>para baixo</b>.'],tip:'Se v estiver paralelo a B, F = |q|vB·sen0° = 0. Nesse caso não existe direção de força para achar.'}}
const increasing=handState%2===0,into=handState<2,inducedInto=into?!increasing:increasing;return {cases:['B entra e aumenta','B entra e diminui','B sai e aumenta','B sai e diminui'],steps:[`O campo externo <b>${into?'entra':'sai'}</b> da folha, e seu fluxo <b>${increasing?'aumenta':'diminui'}</b>.`,`Pela Lei de Lenz, o campo induzido deve <b>${increasing?'se opor ao aumento':'tentar manter o fluxo que está diminuindo'}</b>: portanto <b>${inducedInto?'entra ⊗':'sai ⊙'}</b>.`,`Agora usa a <b>mão direita</b> na espira: corrente <b>${inducedInto?'horária ↷':'anti-horária ↶'}</b> (vista de frente).`],tip:'Lenz primeiro (qual B induzido se opõe à variação do fluxo?), mão direita depois (qual sentido da corrente cria esse B?).'}
}
function renderMao(){const info=handExplanation();return `<div class="eyebrow">MÓDULOS 16–18 · FÍS A</div><h1 class="title">✋ Regra da mão direita</h1><p class="lead">O método do teu professor para as direções no eletromagnetismo. Seleciona o caso e vê como aplicar com a própria mão.</p><div class="panel"><h2>1. Que situação apareceu na questão?</h2><div class="handbuttons">${HANDMODES.map(([id,label])=>`<button data-handmode="${id}" class="${handMode===id?'selected':''}">${label}</button>`).join('')}</div><h2>2. Escolha o sentido</h2><div class="handbuttons">${info.cases.map((x,i)=>`<button data-handcase="${i}" class="${handState===i?'selected':''}">${x}</button>`).join('')}</div><div class="handgrid"><div class="handviz">${handFigure()}</div><div class="handsteps"><h3>3. Faz com a mão de verdade</h3>${info.steps.map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join('')}<div class="note"><b>Macete</b>${info.tip}</div></div></div></div><div class="panel" style="margin-top:17px"><h2>Vídeos e fontes conferidas</h2><p class="tinyexpl">Aulas e materiais explicando a mesma lógica. Professores podem escolher versões equivalentes da regra, mas a direção física final deve ser a mesma.</p><div class="vids"><a href="https://www.youtube.com/watch?v=n0Vm4pUCFQA" rel="noopener noreferrer" target="_blank">▶ Prof. Boaro · campo no fio e mão direita<small>Vídeoaula sobre Ørsted e regra da mão direita</small></a><a href="https://www.youtube.com/watch?v=2vSokYD8J_s" rel="noopener noreferrer" target="_blank">▶ Prof. Boaro · Faraday e Lei de Lenz<small>Fluxo magnético e corrente induzida</small></a><a href="https://enem.proenem.com.br/eletromagnetismo/" rel="noopener noreferrer" target="_blank">↗ ProEnem · força magnética com mão direita<small>Regra para cargas positivas e inversão para negativas</small></a></div><p class="tinyexpl">Para <strong>espelhos esféricos</strong> (Física B), não se usa a mão direita: é óptica, com raios notáveis e equação de Gauss.</p></div>`}

function renderLab(){return `<div class="eyebrow">FÍSICA NA PRÁTICA</div><h1 class="title">Laboratórios interativos</h1><p class="lead">Mexe nas variáveis e vê a conta mudar em tempo real. Aqui as fórmulas deixam de parecer feitiçaria.</p><div class="labnav"><button class="labtab ${lab==='fio'?'selected':''}" data-lab="fio">🧲 Campo no fio</button><button class="labtab ${lab==='forca'?'selected':''}" data-lab="forca">⚡ Força magnética</button><button class="labtab ${lab==='espelho'?'selected':''}" data-lab="espelho">🪞 Espelhos esféricos</button></div><div id="labbody">${lab==='fio'?labWire():lab==='forca'?labForce():labMirror()}</div>`}
function render(){page=decodeURIComponent(location.hash.replace(/^#\//,''))||'home';const l=LESSONS.find(x=>page==='lesson/'+x.id);const html=l?renderLesson(l):({home:renderHome,formulas:renderFormulas,laboratorio:renderLab,mao:renderMao,flash:renderFlash,quiz:renderQuiz}[page]||renderHome)();$('#view').innerHTML=html;updateNav();closeMenu()}
function theme(){document.body.classList.toggle('dark',store.theme==='dark');$('#theme').textContent=store.theme==='dark'?'☀':'☾'}
document.addEventListener('click',e=>{
const nav=e.target.closest('[data-page],[data-page-link]');if(nav){lessonAnswer=null;lessonChecked=false;go(nav.dataset.page||nav.dataset.pageLink);return}
const handTab=e.target.closest('[data-handmode]');if(handTab){handMode=handTab.dataset.handmode;handState=0;render();return}
const handCase=e.target.closest('[data-handcase]');if(handCase){handState=Number(handCase.dataset.handcase);render();return}
const next=e.target.closest('[data-nav]');if(next){lessonAnswer=null;lessonChecked=false;go('lesson/'+next.dataset.nav);return}
const mark=e.target.closest('[data-complete]');if(mark){const id=mark.dataset.complete;store.done=store.done.includes(id)?store.done.filter(v=>v!==id):[...store.done,id];save();render();return}
const ans=e.target.closest('[data-mini]');if(ans&&!lessonChecked){lessonAnswer=Number(ans.dataset.mini);render();return}
if(e.target.closest('[data-checkmini]')){lessonChecked=true;render();return}
const tab=e.target.closest('[data-lab]');if(tab){lab=tab.dataset.lab;render();return}
if(e.target.closest('#flip')){flipPhys();return}
if(e.target.closest('#next')){stepPhys(1);return}
if(e.target.closest('#prev')){stepPhys(-1);return}
if(e.target.closest('#know')){markPhys('know');return}
if(e.target.closest('#again')){markPhys('again');return} if(e.target.closest('#reviewPhys')){physFilter='review';physOrder=[];flashIdx=0;flashFlipped=false;render();return} if(e.target.closest('#allPhys')){physFilter='all';physOrder=[];flashIdx=0;flashFlipped=false;render();return} if(e.target.closest('#shufflePhys')){physOrder=physDeck().map(c=>c.id).sort(()=>Math.random()-.5);flashIdx=0;flashFlipped=false;render();return}
const start=e.target.closest('[data-start]');if(start){pickQuiz(Number(start.dataset.start));return}
const choice=e.target.closest('[data-choice]');if(choice&&quiz&&!quiz.checked){quiz.a[quiz.i]=Number(choice.dataset.choice);render();return}
if(e.target.closest('#checkQ')&&quiz){if(quiz.a[quiz.i]===undefined)return;quiz.checked=true;render();return}
if(e.target.closest('#nextQ')&&quiz){if(quiz.i===quiz.q.length-1){quiz.done=true;const score=quiz.q.filter((z,i)=>quiz.a[i]===z.a).length;store.best=Math.max(store.best,Math.round(score/quiz.q.length*100));save()}else{quiz.i++;quiz.checked=false}render();return}
if(e.target.closest('[data-restart]')){quiz=null;render();return}
});
document.addEventListener('change',e=>{if(e.target.id==='physFlashFilter'){physFilter=e.target.value;physOrder=[];flashIdx=0;flashFlipped=false;render()}});document.addEventListener('input',e=>{const t=e.target.dataset.range;if(!t)return;const val=Number(e.target.value);if(t==='current')I=val;if(t==='radius')r=val;if(t==='charge')q=val;if(t==='velocity')v=val;if(t==='field')B=val;if(t==='angle')angle=val;if(t==='object')p=val;const strong=e.target.closest('label')?.querySelector('strong');if(strong){const units={current:' A',radius:' cm',charge:' μC',velocity:' m/s',field:' T',angle:'°',object:' cm'};strong.textContent=(t==='field'?val.toFixed(1).replace('.',','):val)+units[t]}const labbody=$('#labbody');if(!labbody)return;if(lab==='fio'){const el=labbody.querySelector('.bigvalue');if(el)el.innerHTML=(20*I/r).toFixed(1).replace('.',',')+' <small>μT</small>';const fig=labbody.querySelector('.svgcard');if(fig)fig.innerHTML=wireSVG()}else if(lab==='forca'){const el=labbody.querySelector('.bigvalue');if(el)el.innerHTML=(q*1e-6*v*B*Math.sin(angle*Math.PI/180)).toFixed(4).replace('.',',')+' <small>N</small>';const fig=labbody.querySelector('.svgcard');if(fig)fig.innerHTML=labForce().match(/<div class="svgcard">([\s\S]*?)<\/div>/)?.[1]||fig.innerHTML}else if(lab==='espelho'){const m=mirrorStats();const els=labbody.querySelectorAll('.bigvalue');if(els.length>=2){els[0].textContent=m.pprime;els[1].textContent=m.mag}const fig=labbody.querySelector('.svgcard');if(fig)fig.innerHTML=mirrorSVG();const feed=labbody.querySelector('.feedback');if(feed)feed.innerHTML='<b>Resultado</b>'+m.quality}});
document.addEventListener('change',e=>{if(e.target.dataset.select==='direction')direction=e.target.value;else if(e.target.dataset.select==='mirror')mirror=e.target.value;else return;render()});
$('#menu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('open')});$('#scrim').addEventListener('click',closeMenu);
$('#theme').addEventListener('click',()=>{store.theme=store.theme==='dark'?'light':'dark';save();theme()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(page==='flash'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){if(e.key==='ArrowRight'){e.preventDefault();stepPhys(1)}if(e.key==='ArrowLeft'){e.preventDefault();stepPhys(-1)}if(e.key===' '){e.preventDefault();flipPhys()}}});
setupNav();theme();if(!location.hash)history.replaceState(null,'','#/home');window.addEventListener('hashchange',()=>{lessonAnswer=null;lessonChecked=false;render()});render();
</script></body></html>
